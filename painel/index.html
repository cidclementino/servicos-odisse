<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Odisse · Catálogo de serviços</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="https://marca.odisse.com.br/v1/marca.css">
  <link rel="stylesheet" href="https://universo.odisse.com.br/base/v1/universo.css">
  <link rel="stylesheet" href="painel.css">
  <script src="/assets/config.js"></script>
  <script src="https://universo.odisse.com.br/base/v1/barra.js" defer></script>
</head>
<body class="u-pagina vista-login">
  <header class="topo">
    <a class="topo-casa" href="#/">
      <span class="topo-selo" aria-hidden="true"></span>
      <span class="topo-logotipo" role="img" aria-label="Odisse"></span>
      <span class="topo-sub">Serviços</span>
    </a>
    <nav class="topo-secoes" id="secoes" aria-label="Seções do painel">
      <a href="#/" data-secao="catalogo">Catálogo</a>
      <a href="#/inicio" data-secao="inicio">Página inicial</a>
      <a href="#/blocos" data-secao="blocos">Blocos</a>
    </nav>
    <div class="topo-acoes">
      <a class="topo-link" href="/inicio/" target="_blank" rel="noopener">Ver o site</a>
      <span data-universo-menu></span>
      <button class="topo-link" id="btSair" type="button">Sair</button>
    </div>
  </header>

  <!-- ===================== ENTRADA ===================== -->
  <main class="entrada" id="entrada">
    <form class="entrada-caixa" id="formEntrada">
      <span class="entrada-selo" aria-hidden="true"></span>
      <h1 class="u-subtitulo">Catálogo de serviços</h1>
      <label class="u-campo"><span>Senha</span><input type="password" id="senha" autocomplete="current-password" required></label>
      <p class="aviso erro" id="erroEntrada" role="alert" hidden></p>
      <button type="submit" class="u-botao forte largo">Entrar</button>
    </form>
  </main>

  <!-- ===================== PÁGINAS (desenhadas pelo painel.js conforme o endereço) ===================== -->
  <main class="pagina" id="pagina" hidden></main>

  <!-- Barra de salvar (Ficha do produto e montador da landing page) -->
  <div class="barra-salvar" id="barraSalvar" hidden>
    <span id="barraTexto">Mudanças não salvas</span>
    <div>
      <button class="u-botao" id="btDescartar" type="button">Descartar</button>
      <button class="u-botao forte" id="btSalvar" type="button">Salvar</button>
    </div>
  </div>

  <!-- Escolher bloco (montador) -->
  <dialog class="dialogo" id="dlgBlocos" aria-labelledby="dlgBlocosTitulo">
    <div class="dlg-cab">
      <h2 class="u-subtitulo" id="dlgBlocosTitulo">Acrescentar bloco</h2>
      <button class="caixa" type="button" data-fechar aria-label="Fechar"></button>
    </div>
    <div class="dlg-corpo" id="dlgBlocosCorpo"></div>
  </dialog>

  <input type="file" accept="image/*" id="arqImagem" hidden>
  <script type="module" src="painel.js"></script>
</body>
</html>
