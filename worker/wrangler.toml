name = "servicos-odisse"
main = "index.js"
compatibility_date = "2026-07-01"

# Namespace KV "SERVICOS_ODISSE". O workflow "Publicar API" cria o namespace
# na primeira publicação (se ainda não existir) e troca o marcador abaixo
# pelo id verdadeiro antes de publicar — não é preciso editar nada aqui.
kv_namespaces = [
  { binding = "SERVICOS", id = "__KV_ID__" },
]

# A senha do painel (SERVICOS_SENHA) é enviada pelo GitHub Actions — nunca coloque o valor aqui.

[vars]
# repositório onde o Worker cria a casca das landing pages novas (com o secret SERVICOS_GITHUB_TOKEN)
GITHUB_REPO = "cidclementino/servicos-odisse"

# Ligação com o Universo (20/11/2026): só a lista dos serviços do PGT (rota bases/lista), para ligar cada produto
# do catálogo a um serviço. Publicar o universo-hub antes (ele precisa do ponto de entrada Servicos).
[[services]]
binding = "UNIVERSO"
service = "universo-hub"
entrypoint = "Servicos"
